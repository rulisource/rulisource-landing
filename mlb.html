<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RuliSource - MLB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <img src="RS_logo_64x64_black_bg.png" alt="RuliSource Logo" class="logo" />
   
    <nav class="navbar">
      <ul>
        <li><a href="mlb.html"><span class="icon">⚾️</span> MLB</a></li>
        <li><a href="#"><span class="icon">⚽️</span> SOCCER</a></li>
        <li><a href="#"><span class="icon">🏀</span> NBA</a></li>
      </ul>
    </nav>
  </header>

  <main class="main">
    <section class="intro">
      <h1>⚾️ MLB Zone ⚾️</h1>

      <h2>Insights, Stats & Picks</h2>
    </section>

    <section class="mlb-table">
      <h2>📊 TOP HITTERS</h2>
      <div id="mlb-data"></div>
    </section>
  </main>

  <!-- Tabletop + MLB Data Table Script -->
  <script src="https://unpkg.com/tabletop@1.6.0/tabletop.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', init);

    function init() {
      Tabletop.init({
        key: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREulzi0RIE8hsE8GFb5F4-j1amwpJ9BZfQq6JdfUxlz5-13pp1prSQo2jnDSpq1C4ZQKssQ7J4moyh/pub?gid=1653485759&single=true&output=csv',
        simpleSheet: true,
        callback: function(data) {
          buildTable(data);
        }
      });
    }

    function buildTable(data) {
      const table = document.createElement('table');
      table.className = 'styled-table';

      // Encabezados
      const header = document.createElement('thead');
      const headerRow = document.createElement('tr');
      Object.keys(data[0]).forEach(key => {
        const th = document.createElement('th');
        th.textContent = key;
        headerRow.appendChild(th);
      });
      header.appendChild(headerRow);
      table.appendChild(header);

      // Cuerpo
      const tbody = document.createElement('tbody');
      data.forEach(row => {
        const tr = document.createElement('tr');
        Object.keys(row).forEach(key => {
          const td = document.createElement('td');
          td.textContent = row[key];

          // Color dinámico para columnas numéricas
          if (["EV", "Hard Hit%", "xwOBA", "xSLG"].includes(key)) {
            const value = parseFloat(row[key]);
            if (!isNaN(value)) {
              td.style.backgroundColor = value >= 50 ? '#B22222' : value >= 40 ? '#8B0000' : 'transparent';
              td.style.color = '#fff';
            }
          }
          if (["K%", "BB%"].includes(key)) {
            const value = parseFloat(row[key]);
            if (!isNaN(value)) {
              td.style.backgroundColor = value <= 10 ? '#003366' : value <= 15 ? '#1E90FF' : 'transparent';
              td.style.color = '#fff';
            }
          }

          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      document.getElementById('mlb-data').appendChild(table);
    }
  </script>

  <footer class="footer">
    <p>&copy; 2025 RuliSource. All rights reserved.</p>
  </footer>
</body>
</html>
